name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. LINT
  # ==========================================
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.6.9

      - name: Run Ruff
        run: |
          ruff check .


  # ==========================================
  # 2. UNIT TEST
  # ==========================================
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v


  # ==========================================
  # 3. SECRET SCAN - GITLEAKS
  # ==========================================
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # 4. DEPENDENCY SECURITY SCAN - PIP AUDIT
  # ==========================================
  dependency-scan:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.7.3

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt


  # ==========================================
  # 5. SAST - CODEQL
  # ==========================================
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================
  # 6. IaC SECURITY SCAN - TRIVY
  # ==========================================
  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy Kubernetes scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "config"
          scan-ref: "k8s/"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"


  # ==========================================
  # 7. GMAIL NOTIFICATION
  # ==========================================
  notify:
    name: Gmail Notification
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - secret-scan
      - dependency-scan
      - sast
      - iac-scan

    # Run notification even when one of the previous jobs fails
    if: always()

    steps:

      # ------------------------------------------
      # Determine overall CI status
      # ------------------------------------------
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.secret-scan.result }}" == "success" ] && \
             [ "${{ needs.dependency-scan.result }}" == "success" ] && \
             [ "${{ needs.sast.result }}" == "success" ] && \
             [ "${{ needs.iac-scan.result }}" == "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi


      # ==========================================
      # SUCCESS EMAIL
      # ==========================================
      - name: Send CI success email
        if: steps.status.outputs.status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: FastAPI DevSecOps CI

          subject: "✅ CI PASSED — FastAPI DevSecOps — ${{ github.sha }}"

          body: |
            FastAPI DevSecOps CI Pipeline PASSED successfully.

            ==========================================
            PIPELINE INFORMATION
            ==========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Author:
            ${{ github.actor }}

            ==========================================
            SECURITY CHECKS
            ==========================================

            ✅ Ruff Lint
            ✅ Pytest
            ✅ Gitleaks Secret Scan
            ✅ pip-audit Dependency Scan
            ✅ CodeQL SAST
            ✅ Trivy Kubernetes/IaC Scan

            ==========================================
            STATUS
            ==========================================

            CI STATUS: SUCCESS

            ==========================================
            GITHUB ACTIONS
            ==========================================

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The pipeline is ready for the CD stage.


      # ==========================================
      # FAILURE EMAIL
      # ==========================================
      - name: Send CI failure email
        if: steps.status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: FastAPI DevSecOps CI

          priority: high

          subject: "🚨 CI FAILED — FastAPI DevSecOps — ${{ github.sha }}"

          body: |
            🚨 FASTAPI DEVSECOPS CI PIPELINE FAILED

            ==========================================
            PIPELINE INFORMATION
            ==========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Author:
            ${{ github.actor }}

            ==========================================
            JOB RESULTS
            ==========================================

            Ruff Lint:
            ${{ needs.lint.result }}

            Pytest:
            ${{ needs.test.result }}

            Gitleaks Secret Scan:
            ${{ needs.secret-scan.result }}

            pip-audit Dependency Scan:
            ${{ needs.dependency-scan.result }}

            CodeQL SAST:
            ${{ needs.sast.result }}

            Trivy Kubernetes/IaC:
            ${{ needs.iac-scan.result }}

            ==========================================
            STATUS
            ==========================================

            CI STATUS: FAILED

            ==========================================
            ACTION REQUIRED
            ==========================================

            One or more CI/security checks failed.

            Please check the GitHub Actions logs immediately.

            ==========================================
            GITHUB ACTIONS
            ==========================================

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
