apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fastapi-alerts
  namespace: fastapi
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: fastapi-app.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="fastapi"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"

        - alert: PodNotReady
          expr: kube_pod_status_ready{namespace="fastapi", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} not ready for 5m"

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="fastapi", deployment="fastapi-app"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "fastapi-app has unavailable replicas"

        - alert: HighCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="fastapi"}[5m])) by (pod) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} CPU usage above limit threshold"

        - alert: HighMemoryUsage
          expr: sum(container_memory_working_set_bytes{namespace="fastapi"}) by (pod) > 220000000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage nearing limit"

        - alert: ApplicationDown
          expr: up{job="fastapi-app"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "FastAPI app is not responding to scrapes"

        - alert: HighHTTPErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="fastapi", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{namespace="fastapi"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "5xx error rate above 5% for fastapi-app"
